name: collect snapshot (lab)
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "줄마다: market date commit kind [real]"
        required: true
permissions:
  contents: read
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: collect          # 수집 열쇠는 이 환경(main 에서만)에만 있다
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect (the operating repo's commit stands in for the sources; --real fetches from the source directly)
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          git init -q --bare "$RUNNER_TEMP/src.git"
          printf '%s\n' "$PLAN" | while read -r market date commit kind real; do
            [ -z "$market" ] && continue
            git --git-dir "$RUNNER_TEMP/src.git" fetch -q --depth 120 https://github.com/fdo2a/fdo2a.github.io "$commit"
            if [ -n "$real" ]; then
              python3 collect.py --market "$market" --date "$date" --src-git "$RUNNER_TEMP/src.git" --commit "$commit" --kind "$kind" --real "$real"
            else
              python3 collect.py --market "$market" --date "$date" --src-git "$RUNNER_TEMP/src.git" --commit "$commit" --kind "$kind"
            fi
          done
      - name: Push with the collector key (rulesets reject every other writer)
        env:
          KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/k"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
          git config user.name "lab collector"
          git config user.email "collector@invalid"
          git add snapshots
          git commit -q -m "snapshot: run $GITHUB_RUN_ID"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push git@github.com:fdo2a/gate-lab-data.git HEAD:main
          rm -f "$RUNNER_TEMP/k"
